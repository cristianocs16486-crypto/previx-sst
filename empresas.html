<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empresas Clientes - PREVIX</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
<header class="bg-slate-900 text-white p-4 flex justify-between">
  <b>PREVIX - Empresas Clientes</b>
  <a href="index.html" class="underline">← Voltar</a>
</header>
<main class="max-w-3xl mx-auto p-4 space-y-6">
  <div class="bg-white rounded-xl p-5 shadow">
    <h2 class="font-bold text-lg mb-4">Cadastrar empresa cliente</h2>
    <div class="grid gap-3">
      <input id="nome" placeholder="Nome da empresa *" class="border p-3 rounded">
      <input id="cnpj" placeholder="CNPJ" class="border p-3 rounded">
      <input id="email" placeholder="E-mail de login *" class="border p-3 rounded">
      <input id="senha" type="password" placeholder="Senha *" class="border p-3 rounded">
      <button onclick="salvar()" class="bg-blue-600 text-white p-3 rounded font-bold">Salvar empresa</button>
      <p id="msg" class="text-sm"></p>
    </div>
  </div>
  <div class="bg-white rounded-xl p-5 shadow">
    <h2 class="font-bold text-lg mb-3">Empresas cadastradas</h2>
    <div id="lista" class="space-y-2"></div>
  </div>
</main>
<script>
async function carregar(){
  const r = await fetch('/api/empresas');
  const dados = await r.json();
  document.getElementById('lista').innerHTML = dados.map(e => `
    <div class="flex justify-between border p-3 rounded">
      <div><b>${e.nome}</b><br><span class="text-sm text-slate-500">${e.email} ${e.cnpj ? '• ' + e.cnpj : ''}</span></div>
      <button onclick="excluir('${e.id}')" class="text-red-600 font-bold">Excluir</button>
    </div>`).join('') || '<p class="text-slate-500">Nenhuma empresa ainda.</p>';
}
async function salvar(){
  const body = { nome: nome.value, cnpj: cnpj.value, email: email.value, senha: senha.value };
  const r = await fetch('/api/empresas', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const j = await r.json();
  document.getElementById('msg').textContent = r.ok ? '✅ Empresa salva!' : '❌ ' + (j.error || 'Erro');
  if(r.ok){ nome.value=cnpj.value=email.value=senha.value=''; carregar(); }
}
async function excluir(id){
  if(!confirm('Excluir esta empresa?')) return;
  await fetch('/api/empresas?id='+id, { method: 'DELETE' });
  carregar();
}
carregar();
</script>
</body>
</html>
